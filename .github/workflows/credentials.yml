# 커밋된 자격증명 리터럴 검사 — **전 브랜치** · 잘커라 정본 전용.
#
# ■ 왜 `ci.yml` 과 따로 있나
#
# 위협 모델이 「**푸시된 순간** 크롤러가 본다」인데, `ci.yml` 은 `main`·`oneque/change-*` 에서만
# 돌고 `client-upgrade.yml` 에는 이 검사가 없다. 공개 레포의 나머지 브랜치 푸시는 아무
# 검사도 안 받았다 — 그 창이 정확히 이 검사의 이유다.
#
# 무거운 스텝(next build·팩 4벌 대조)을 전 브랜치로 넓히지 않으려고 워크플로를 가른다.
# 이 검사는 node 내장과 `git` 만 쓰고 실측 58ms 라 전 브랜치에 걸어도 비용이 없다.
#   재현: `time node scripts/lib/credential-literals.mjs`
#
# ⚠ **이 파일은 고객 zip 에 안 실린다**(`SOURCE_EXCLUDES`). `ci.yml` 과 달리 고객 트리에서
#   돌 일이 없으므로 정본 전용 판별자가 필요 없다 — 파일 자체가 거기 없다.
name: credentials

on:
  push:
    branches: ["**"]
  pull_request:

# 읽기만 하면 된다. 기본값에 기대지 않는다.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ⚠ `npm ci` 를 안 한다 — 의존이 0이라 필요 없고, 설치가 이 검사보다 앞서면 설치 실패가
      #   검사 부재로 둔갑한다.
      - run: node scripts/lib/credential-literals.mjs
