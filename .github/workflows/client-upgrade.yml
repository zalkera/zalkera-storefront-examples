# @zalkera/client vendored 업그레이드 — lockfile 재생성 워크플로.
#
# 백엔드(Git Data API)가 oneque/client-upgrade-* 브랜치에 새 타르볼 + 치환 package.json 을 한 커밋으로 올리면,
# 이 워크플로가 npm install 로 package-lock.json 을 재생성(백엔드는 npm 을 못 돌린다) + validate/typecheck/build
# 로 검증 + lockfile 을 같은 브랜치에 커밋한다. 백엔드는 이 CI green 을 확인한 뒤 PR 을 squash merge 한다.
name: client-upgrade

on:
  push:
    branches: ["oneque/client-upgrade-*"]

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    # ⚠ **`ci.yml` 과 같은 값이어야 한다.** `src/lib/env.ts` 의 `tenantCode()` 는 폴백이 없어서
    #   (없으면 크게 실패하는 게 맞다는 처분) 이 블록이 없으면 `npm run build` 가 **항상 rc 1** 이다 —
    #   그러면 이 워크플로는 구조적으로 영구 적색이고, 아래 lockfile 커밋 스텝에 **도달하지 못한다**.
    #   그 상태를 재는 자리다. 이름은 서빙 인프라가 주입하는 것과 같아야 한다.
    env:
      ZALKERA_API_BASE: http://localhost:8100
      ZALKERA_TENANT: ci-placeholder
      ZALKERA_OFFLINE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.ref_name }}"

      - uses: actions/setup-node@v4
        with:
          # ⚠ **`ci.yml` 과 같아야 한다.** `npm test` 가 `--experimental-strip-types` 를 쓰는데
          #   node 20 은 그 플래그를 모른다(`bad option`, rc=9). 그러면 이 워크플로가 구조적으로
          #   영구 적색이고 아래 lockfile 커밋 스텝에 도달하지 못한다 — 즉 이 팩으로 개시한
          #   모든 테넌트의 client 승급이 정지한다. `package.json` 의 `engines` 가 잣대다.
          #   재현: `npx --yes node@20 --experimental-strip-types --test 'src/**/*.test.ts'; echo rc=$?`
          node-version: 22

      # ⚠ `--ignore-scripts` — 이 잡은 `contents: write` 토큰을 들고 돌고, `checkout` 이 그것을
      #   `.git/config` 에 남긴다. 락파일을 **재생성**하는 자리라 `npm ci` 를 못 쓰므로 범위 의존이
      #   그 순간 최신으로 풀리는데, 그중 하나가 오염돼 있으면 설치 스크립트가 그 토큰을 가져간다.
      #   이 트리의 의존 중 설치 스크립트를 쓰는 것은 0개다
      #   (재현: `node scripts/lib/install-scripts.mjs`). 나중에 그런 의존이
      #   생기면 여기서 **크게 실패**하는 편이 조용히 도는 것보다 낫다.
      - run: npm install --ignore-scripts   # lockfile 재생성 + 설치
      # 고객 zip 은 루트 `llms.txt`(= client 운반본의 사본)를 나른다. client 를 올리면 그 사본도
      # 같이 올라가야 명세가 안 낡는다 — 이 레포에는 사본이 없지만(정본 하나 원칙), 사본을 둔
      # 체크아웃에서 이 워크플로가 돌 때를 대비해 있으면 갱신한다. 없으면 무동작.
      - name: refresh llms.txt copy (if present)
        run: |
          # ⚠ 사본이 있는데 설치본에 없으면 **멈춘다.** 조용히 넘어가면 낡은 사본이 새 락파일과
          #   함께 커밋되어, 락파일이 가리키는 버전과 트리의 명세가 갈린다 — 이 스텝이 막으려는
          #   바로 그 상태다. 같은 조건에서 `pack-preset.mjs` 는 `LLMS_MISSING` 으로 실패한다.
          if [ -f llms.txt ]; then
            if [ -f node_modules/@zalkera/client/llms.txt ]; then
              cp node_modules/@zalkera/client/llms.txt llms.txt
            else
              echo "::error::설치된 @zalkera/client 에 llms.txt 가 없습니다 — 트리 사본이 낡은 채 커밋됩니다."
              exit 1
            fi
          fi

      # ⚠ `npm test` 를 뺐다가 사고 형상이 하나 남았다 — 계약 rev 가 오르면 `docsRev` 가 드리프트를
      #   잡는데, 여기서 안 돌면 승급이 **초록으로 머지되고** 그 다음 push 의 본 CI 에서야 빨개진다.
      #   그때는 되돌릴 브랜치가 이미 없다. 승급을 만드는 자리에서 잡는 것이 맞다.
      #   (고객 트리에서 `docsRev` 는 skip 이므로 이 줄이 남의 승급을 막지 않는다.)
      - run: npm run validate && npm run typecheck && npm test && npm run build

      - name: commit lockfile
        env:
          REF: "${{ github.ref_name }}"
        run: |
          git config user.name "zalkera-bot"
          git config user.email "bot@zalkera.com"
          # ⚠ **`llms.txt` 도 싣는다.** 위 스텝이 설치본으로 그것을 갱신하므로, 여기서 안 실으면
          #   러너가 사라질 때 그 갱신이 버려진다. 그러면 락파일이 가리키는 버전과 트리의 명세가
          #   갈리고, README 의 「`npm ci` 뒤 `node_modules/@zalkera/client/llms.txt` 와 대조하면
          #   동일합니다」가 거짓이 된다 — 팩에 실리는 문서 **4개**가 `llms.txt` 를 가리키므로,
          #   갈린 명세가 그대로 계약 노릇을 한다.
          #   재현: git ls-files '*.md' | grep -v '^presets/' | xargs grep -ln 'llms\.txt'
          #   정본 레포에는 `llms.txt` 가 없으므로 있을 때만 더한다.
          git add package-lock.json
          if [ -f llms.txt ]; then git add llms.txt; fi
          git commit -m "chore: regenerate lockfile for @zalkera/client upgrade" || echo "no lockfile change"
          # ⚠ 브랜치 이름을 `run:` 에 직접 보간하지 않는다 — GitHub 식(달러 + 이중 중괄호)은 bash
          #   파싱 **전에** 텍스트로 치환되고, 큰따옴표 안이라 `$( )`·백틱이 평가된다.
          #   `git check-ref-format` 은 그런 이름을 통과시킨다. env 로 넘겨 셸이 값으로만 보게 한다.
          #
          #   ⚠ 이 주석에 그 식을 **글자 그대로 쓰면 안 된다.** 블록 스칼라 안에서는 `#` 이 YAML
          #   주석이 아니라 본문이라, GitHub 이 그것을 진짜 식으로 읽는다. 안이 비어 있으면
          #   「An expression was expected」로 파일 전체가 파싱에 실패하고, 워크플로가 아예
          #   기동하지 않는다 — 잡의 실패가 아니라 startup failure 라 로그도 안 남는다.
          #   `scripts/workflow-syntax.test.mjs` 가 이 형상을 막는다.
          git push origin "HEAD:$REF"
