# @zalkera/client vendored 업그레이드 — lockfile 재생성 워크플로.
#
# 백엔드(Git Data API)가 oneque/client-upgrade-* 브랜치에 새 타르볼 + 치환 package.json 을 한 커밋으로 올리면,
# 이 워크플로가 npm install 로 package-lock.json 을 재생성(백엔드는 npm 을 못 돌린다) + validate/typecheck/build
# 로 검증 + lockfile 을 같은 브랜치에 커밋한다. 백엔드는 이 CI green 을 확인한 뒤 PR 을 squash merge 한다.
name: client-upgrade

on:
  push:
    branches: ["oneque/client-upgrade-*"]

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.ref_name }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install          # lockfile 재생성 + 설치
      # 고객 zip 은 루트 `llms.txt`(= client 운반본의 사본)를 나른다. client 를 올리면 그 사본도
      # 같이 올라가야 명세가 안 낡는다 — 이 레포에는 사본이 없지만(정본 하나 원칙), 사본을 둔
      # 체크아웃에서 이 워크플로가 돌 때를 대비해 있으면 갱신한다. 없으면 무동작.
      - name: refresh llms.txt copy (if present)
        run: |
          if [ -f llms.txt ] && [ -f node_modules/@zalkera/client/llms.txt ]; then
            cp node_modules/@zalkera/client/llms.txt llms.txt
          fi

      - run: npm run validate && npm run typecheck && npm run build

      - name: commit lockfile
        run: |
          git config user.name "zalkera-bot"
          git config user.email "bot@zalkera.com"
          git add package-lock.json
          git commit -m "chore: regenerate lockfile for @zalkera/client upgrade" || echo "no lockfile change"
          git push origin HEAD:"${{ github.ref_name }}"
