# 잘커라(Zalkera) 스토어프론트 Tier2 게이팅 CI.
#
# 잘커라 배포 게이트가 GitHub Checks API 로 이 워크플로의 성공을 확인한 뒤에만
# Tier2(코드 배포) 를 진행한다. 세 단계는 27-real-codegen-deploy-pipeline.md §7.1·§9.3(T0)
# 의 정본:
#   1) validate     — 키트 validator(scripts/validate-storefront.mjs, llms.txt §5 규약)
#   2) tsc --noEmit  — 타입 정합
#   3) next build    — 실제 빌드 성공
name: storefront-ci

on:
  push:
    # main 배포 + codegen 작업 브랜치(oneque/change-*) — 게이트가 브랜치 CI 결론을 읽으려면 브랜치 push 에도 돌아야 함.
    # oneque/client-upgrade-* 는 client-upgrade.yml 이 전담(lockfile 재생성 전 SHA 에서 npm ci 가 헛도는 red 방지).
    branches: [main, "oneque/change-*"]
  pull_request:

# 레포·조직 기본값에 기대지 않는다. 이 워크플로는 읽기만 하면 된다 — 고객 레포마다 기본값이 다르고,
# 기본이 write 인 곳에서는 여기서 도는 모든 것이 쓰기 토큰을 들고 돈다.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # 빌드 시점에 백엔드 접속이 필요 없도록 안전한 기본값만 주입(SSR fetch 는 런타임에 일어남).
      # ZALKERA_TENANT 는 실재하지 않아도 된다 — 러너에 백엔드가 없어 어차피 fetch 가 실패하고,
      # 코드가 폴백 없이 require 하므로 값 자체는 있어야 한다.
      # 이름은 서빙 인프라가 주입하는 것과 **반드시 같아야 한다** —
      # 구 `ONEQUE_*` 로 두면 폴백이 제거된 지금 `env.ts` 가 던져 빌드가 죽는다.
      ZALKERA_API_BASE: http://localhost:8100
      ZALKERA_TENANT: ci-placeholder
      # 이 러너에는 백엔드가 **없다**는 선언이다. 서빙 인프라·검수 러너와 같은 값을 주어 패리티를 지킨다.
      # ⚠ **다만 이 플래그는 지금 아무것도 바꾸지 않는다** — 읽는 코드(`src/lib/buildEnv.ts` 의
      #   `isOfflineBuild`)에 호출자가 0개다(실측). 켜든 안 켜든 백엔드가 죽어도 빌드는 통과한다.
      #   "안 켜면 장애 때 빌드가 막아 준다"고 읽지 마라 — 막지 않는다. 사정은 `.env.example` 에 있다.
      ZALKERA_OFFLINE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate (키트 validator)
        run: npm run validate

      - name: 잘커라 레포 전용 — 관문 모드로 한 번 더
        # 위 스텝은 **권고 모드**다. 권고는 "못 읽은 자리"가 있어도 rc 0 을 낸다 — 고객 나무의 상태를
        # 우리가 벌하지 않는다는 처분이고 고객 레포에서는 그게 맞다. 그러나 우리 레포는
        # **팩의 원본**이라 여기서 새는 것은 전 테넌트로 복제된다.
        #
        # ⚠ **이 스텝을 위 스텝 대신 쓰면 안 된다.** `ci.yml` 은 고객 zip 에 실리므로(SOURCE_EXCLUDES 에
        # 없다) `--gate` 로 바꾸면 **전 테넌트의 CI 가 관문 모드가 되고**, 배포 게이트가 이 워크플로의
        # 성공을 읽으므로 거짓 양성 하나가 그 사이트의 배포를 무환불로 막는다. 같은 비대칭 때문에
        # 방문자 IP 검사기를 배송에서 뺐다(SOURCE_EXCLUDES 주석). 그래서 **레포 전용 판별자**로 가른다 —
        # 이 파일이 아래 스텝에서 이미 쓰는 관용구다(`presets/` + `scripts/pack-preset.mjs` 의 교집합).
        run: |
          if [ -d presets ] && [ -f scripts/pack-preset.mjs ]; then
            npx zalkera-validate ./src --gate
          else
            echo "관문 모드 재검사는 잘커라 레포 전용입니다 — 건너뜁니다."
          fi

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Test (교차사이트·프리뷰 가드 회귀 픽스처)
        # 판정 규칙은 한 줄만 흔들려도 조용히 열린다. Node 기본 러너 + 타입 스트리핑이라
        # devDependency 추가가 0이다(node 22 필요). 검사기 X1 은 "가드를 불렀는가"만 보므로
        # **가드가 옳은가**는 이 스텝에서만 잠긴다.
        #
        # ⚠ **픽스처가 없으면 실패해야 한다.** 글롭이 아무것도 안 물면 node 러너는 `# tests 0` 과
        # 함께 rc 0 을 낸다 — 파일을 지우는 것만으로 이 잠금이 조용히 초록이 된다.
        #   재현: `node --experimental-strip-types --test 'src/lib/GHOST.test.ts'; echo rc=$?`
        #
        # ⚠ **개수로 재지 않는다.** 파일 존재는 빈 파일 하나로, 총 통과 수 하한은 자명 통과 시험
        #   여러 개로 뚫린다 — 개수는 **이름을 재지 않는다.** 그래서 **스위트마다** 하한을 건다.
        #
        # 하한값은 `scripts/lib/test-floors.json` 에 있다(재현: `cat scripts/lib/test-floors.json`).
        # 현재치는 표에서 키를 뽑아 잰다 — `src/lib/*.test.ts` 글롭은 표의 절반만 덮는다.
        #   · 하한은 **현재치와 같다.** 여유를 두면 그만큼의 가드 시험을 지워도 통과한다 —
        #     여유 4였을 때 crossOrigin 의 CSRF Content-Type 가드 4건이 통째로 지워지고도 초록이었다.
        #     통제군(관문 존재·배선·면제목록↔마커 대칭)이 섞여 있어 그것만 빠져도 관문이 사라진
        #     상태가 초록이 된다. 시험을 더하거나 합치면 하한 파일을 **같이** 고쳐라.
        run: |
          set -o pipefail
            # ⚠ `docsRev.test.ts` 는 하한표에 없다 — **정본 전용**이라 고객 트리에서 skip 되고,
            #   skip 은 통과 0이라 하한이 거짓 적색을 낸다. 게이트의 글롭은 그 시험도 물어서 돌린다 —
            #   하한만 안 걸 뿐이다.
            #
            # 하한 집행은 `scripts/lib/floor-gate.mjs` 하나가 한다 — 시험을 **한 판**만 돌려서
            # 파일별 통과 수를 뽑는다. 종전엔 그 뒤에 스위트를 한 벌씩 다시 돌렸고, 그 재실행이
            # 이 스텝의 대부분이었다. 실측 3.02초 → 1.08초. 재현:
            #   node scripts/lib/floor-gate.mjs
            #   npm test && for f in $(node -p 'Object.keys(require("./scripts/lib/test-floors.json")).filter(k=>k!=="_").join(" ")'); do node --experimental-strip-types --test -- "$f"; done
            #
            # ⚠ **요구 스위트 목록을 여기 적지 않는다.** 종전엔 이 파일과 `scripts/lib/floors.mjs`
            #   양쪽에 같은 목록이 있었다. 둘이 갈리면 어느 쪽이 참인지 알 수 없다 — 정본은
            #   저쪽 `REQUIRED_FLOORS` 하나다.
            #
            # ⚠ **여기서 안 잡는 것.** ⑴ 하한을 **낮추는** 편집 — 이 파일이 곧 이 레포의 하한이라
            #   낮춤은 자기 결정이다. 우리 팩에 대해서는 `verify-zip --pack` 이 `REQUIRED_FLOORS` 와
            #   대조해 반려한다. ⑵ 시험 **내용**을 자명통과로 갈아치우는 것 — 하한은 통과 **개수**만
            #   세기 때문이다. 그 둘은 코드 리뷰가 본다.
            node scripts/lib/floor-gate.mjs

      - name: Build (next build)
        run: npm run build

      - name: 프리뷰 관문이 빌드에 실렸는가
        # 재는 것은 소스가 아니라 **Next 가 방금 실은 산출물**이다. 관문이 등재되지 않으면 프리뷰
        # 쓰기 차단이 통째로 꺼지는데, 소스를 읽는 검사는 그 형상을 못 본다 — 파일이 멀쩡해도 위치
        # 오류·matcher 오염·규약 변경으로 안 실릴 수 있다.
        #
        # 판정은 **성질**이다: 이 트리의 라우트가 전부 덮이는가. 리터럴 matcher 를 요구하면
        # 정적 파일을 빼는 정당한 완화도 막힌다(`scripts/lib/gate-probe.mjs`).
        #
        # ■ **행위 검사는 우리 레포에서만 돈다.** 그것은 프리뷰·비프리뷰 빌드를 각각 한 번 더 구우므로
        #   `next build` **1회 시간의 약 2배**가 얹힌다. 그 시간은 테넌트마다 매 푸시·매 PR 에 붙고,
        #   배포 게이트가 이 워크플로를 읽으므로 곧 "말로 고치기"의 지연이 된다.
        #   재현(빌드 하나 대 빌드+행위검사):
        #     for i in 1 2; do
        #       S=$(date +%s%N); npm run build >/dev/null; M=$(date +%s%N)
        #       node scripts/lib/gate-behavior.mjs . >/dev/null; E=$(date +%s%N)
        #       echo "build $(((M-S)/1000000 ))ms · build+gate $(((E-S)/1000000 ))ms"
        #     done
        #   이 기계(12코어)에서 6.4s → 19.9s. 러너 사양에 따라 달라지므로 비율(약 3배)로 읽어라.
        #
        #   그 오라클이 잡는 것은 **팩 소스의 관문이 무력화됐는가**이고, 그건 4벌이 갈리는 것을 막는
        #   우리 문제다 — 보호는 우리가 받고 벌은 고객이 무는 배치가 된다(방문자 IP 검사기를 배송에서
        #   뺀 것과 같은 논리). 고객 zip 에 대한 집행은 `verify-zip --pack` 이 진다.
        #   등재 검사(`gate-probe`)는 빌드를 더 굽지 않으므로 그대로 둔다.
        #
        #   ⚠ `gate-behavior.mjs` 자체는 **계속 배송한다.** `verify-zip --pack` 이 부르고 부재를
        #     반려로 치기 때문이다. 빼면 우리 팩 라운드가 통째로 막힌다.
        #
        #   ⚠ **검사기 부재를 raw 예외로 죽이지 않는다.** 아래 마지막 스텝과 같은 관용구다 —
        #     `MODULE_NOT_FOUND` 는 조치 불가능한 메시지이고 배포 게이트를 막는다.
        run: |
          if [ ! -f scripts/lib/gate-probe.mjs ]; then
            echo "::error::scripts/lib/gate-probe.mjs 가 없습니다 — 프리뷰 관문이 무엇을 덮는지 잴 수단이 사라집니다. 이 검사기는 팩이 배송하는 파일입니다."
            exit 1
          fi
          node scripts/lib/gate-probe.mjs
          if [ -d presets ] && [ -f scripts/pack-preset.mjs ]; then
            if [ ! -f scripts/lib/gate-behavior.mjs ]; then
              echo "::error::scripts/lib/gate-behavior.mjs 가 없습니다 — 관문이 실제로 막는지 잴 수단이 사라집니다. 고객 레포라면 presets/ 또는 scripts/pack-preset.mjs 를 지우십시오."
              exit 1
            fi
            node scripts/lib/gate-behavior.mjs .
          fi

      - name: 콘텐츠 페이지가 실제로 서는가
        # `content/pages/<slug>.json` 을 넣으면 그 주소가 생긴다 — 배송 문서가 그렇게 가르친다.
        # 그런데 그 약속을 재는 검사가 없어서, 넷이 전부 초록인 채로 페이지가 사라지는 형태가
        # 셋 있었다(한글 slug 404 · 매니페스트 축약 표기 · 예약 세그먼트 그림자화).
        # 셋을 각각 다른 축이 잡는다: 소스 배선(키↔값·축약) · `srcRoute`(그림자화) · `status`(디코딩 누락).
        # 글자 대조는 안 쓴다 — 제목은 남의 화면에도 있을 수 있어 «누가 이 주소를 만들었나»를 못 가른다.
        run: node scripts/lib/content-routes.mjs

      - name: 서빙 산출물 (.next/standalone/server.js)
        # `next build` 성공은 **서빙된다**를 뜻하지 않는다. 잘커라 호스팅은 `next start` 가
        # 아니라 자기완결 산출물을 `node server.js` 로 띄우므로, standalone 이 안 나오면 이 레포의
        # 소스로 개시한 사이트는 서빙 박스에서 exit 4 로 반려된다(2026-08-01 실사고).
        # 재는 것은 next.config 의 문자열이 아니라 **방금 낸 산출물**이다 — 빌드는 이미 위에서 돌았고
        # (추가 비용 0), 설정 정적 판독은 조건부 조립 앞에서 양방향으로 거짓말한다.
        run: test -f .next/standalone/server.js

      - name: 잘커라 레포 전용 검사 (팩 4벌 대조 · 방문자 IP 선언)
        # 검사기 **둘 다 고객 zip 에 안 실린다**(SOURCE_EXCLUDES). 우리 레포에서 팩 4벌이 갈리는 것을
        # 막는 물건이라 그게 맞다 — 그런데 `ci.yml` 은 **실린다.** 무조건 부르면 고객 레포에서
        # MODULE_NOT_FOUND 로 **CI 가 영구 적색**이 되고, 배포 게이트가 이 워크플로의 성공을
        # 읽으므로 그 사이트는 "말로 고치기"가 구조적으로 막힌다 — 실제로 한 번 그렇게 됐다.
        #
        # ■ 배선 동일성 — 얼굴은 갈려도 되고 **틀리면 사고가 나는 배선**만 바이트로 잠근다.
        # ■ 방문자 IP 선언 — 바이트 잠금이 못 보는 자리다(그 파일은 얼굴이라 목록 밖). 2026-08-10 에
        #   정확히 그 사각에서 skeleton 주문 상세 페이지의 선언이 빠진 채 CI 가 5일간 초록이었다.
        run: |
          # 판별자는 **존재 두 개의 교집합**이다: `presets/` + `scripts/pack-preset.mjs`.
          #
          # 부재(`! -f .zalkera/pack.json`)로 가르던 판을 뒤집었다(5차 W1) — 같은 zip 안의
          # `CUSTOMIZE.md` 가 고객에게 "`.zalkera/pack.json` 은 **지워도 된다**"고 가르치는데,
          # 그 말을 따른 고객이 최상위 `presets/` 까지 갖게 되면 **영구 적색 + 조치 불가능한 오류 메시지**가
          # 된다. 배송 문서와 배송 CI 가 서로 모순인 상태였다.
          #
          # 존재 기준이 더 강한 이유가 하나 더 있다: 부재 기준은 **파일을 하나 만들면 가드가 조용히 꺼진다**
          # ("가드를 지우는 것이 고치는 것보다 쉬우면 안 된다"는 규약과 반대 방향 · 5차 관찰 O3).
          # `pack-preset.mjs` 는 SOURCE_EXCLUDES 라 고객 zip 에 **구조적으로 절대 없다.**
          if [ -d presets ] && [ -f scripts/pack-preset.mjs ]; then
            # 픽스처를 먼저 돌린다 — **검사기가 옳은지**를 먼저 묻고 소스를 잰다.
            # 이 검사기는 여섯 라운드 연속 수정됐고 매번 새 구멍이 났다(그 이력이 픽스처 파일 머리말에).
            #
            # ⚠ **존재검사가 먼저다.** 아래 루프는 친절한 오류를 내도록 가드가 걸려 있는데, 이 픽스처만
            # 루프 **앞**에서 무방비로 돌았다. 그래서 판별자가 참이 되는 순간(고객이 `presets/` 를 만들고
            # `scripts/pack-preset.mjs` 라는 이름의 파일을 두면 성립한다) raw `MODULE_NOT_FOUND` 로 죽어
            # **CI 가 영구 적색**이 되고, 배포 게이트가 이 워크플로를 읽으므로 그 사이트는 "말로 고치기"가
            # 구조적으로 막힌다 — 이 스텝 주석이 스스로 막겠다고 적은 바로 그 형상이다.
            if [ ! -f scripts/lib/visitor-ip-parity.test.mjs ]; then
              echo "::error::이 트리가 잘커라 정본 저장소로 판정됐는데 scripts/lib/visitor-ip-parity.test.mjs 가 없습니다."
